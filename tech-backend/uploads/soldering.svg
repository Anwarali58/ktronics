<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="station" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="230" fill="#60a5fa" opacity="0.12"/>
  <!-- Station Base -->
  <rect x="220" y="160" width="360" height="260" rx="24" fill="url(#station)" stroke="#93c5fd" stroke-width="4"/>
  <!-- Display Screen -->
  <rect x="270" y="200" width="260" height="90" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="400" y="260" font-family="Courier, monospace" font-weight="900" font-size="44" fill="#38bdf8" text-anchor="middle" letter-spacing="4">350°C</text>
  <!-- Control Knobs & Buttons -->
  <circle cx="310" cy="345" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="310" y1="345" x2="310" y2="325" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="345" r="18" fill="#ef4444"/>
  <text x="400" y="351" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">POWER</text>
  <circle cx="490" cy="345" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <!-- Iron Pencil -->
  <path d="M 600 420 L 700 180" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <polygon points="700,180 715,145 690,170" fill="#f59e0b"/>
  <!-- Text -->
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#60a5fa" letter-spacing="2">PRO ESD SOLDERING STATION</text>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Digital Temperature Controlled 60W</text>
</svg>
